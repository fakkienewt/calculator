<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="calc">
        <output class="calc-screen">
            <p id="first-number">0</p>
        </output>
        <div class="buttons">
            <div class="btn ac bg-gray">ac</div>
            <div class="btn erase bg-gray">🠜</div>
            <div class="btn operator bg-gray">/</div>

            <div class="btn btns">7</div>
            <div class="btn btns">8</div>
            <div class="btn btns">9</div>
            <div class="btn operator bg-orange">*</div>

            <div class="btn btns">4</div>
            <div class="btn btns" id="five">5</div>
            <div class="btn btns" od="six">6</div>
            <div class="btn operator minus bg-orange">-</div>

            <div class="btn btns">1</div>
            <div class="btn btns">2</div>
            <div class="btn btns">3</div>
            <div class="btn operator bg-orange">+</div>

            <div class="btn operator bg-gray">%</div>
            <div class="btn btns">0</div>
            <div class="btn operator bg-gray">.</div>
            <div class="btn equal bg-orange">=</div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
